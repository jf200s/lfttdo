[package]
name = "qwen-do"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qwen_do_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `dialog:allow-open` 是 capabilities 里唯一的外部插件权限（spec:459 / T15 的图片附件入口），
# 所以插件必须真的注册 —— 只写权限不装插件会在 build 时炸（R108）。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = { version = "0.42.2", features = ["chat-completion", "realtime"] }
futures = "0.3.34"
tokio = { version = "1.53.3", features = ["full"] }
base64 = "0.23.1"
# R139：默认 features 会拉进 default-formats = avif(ravif)/bmp/dds/exr/ff/gif/hdr/ico/jpeg/
# png/pnm/qoi/tga/tiff/webp + rayon。本任务只需要 **gif / jpeg / png / webp 解码** 与
# **jpeg / png 编码**。安装包 <15MB 是验收线（Cargo.toml 里 reqwest 那条注释同一条红线），
# 所以这里关掉默认 features，只点四个格式。
# 注：`rayon` 关掉后单张 4000px 缩放是否变慢**未实测**，不许预防性加回来。
image = { version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
rmcp = { version = "3.5.1", features = ["client", "transport-io", "transport-child-process"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
thiserror = "2.0.21"
# default-features=false + default-tls 保持 rustls（async-openai 已带入）。
# 打开 native-tls 会多出一整套系统 TLS 依赖，安装包 <15MB 是验收线，别放宽这行。
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls"] }
tokio-util = "0.7.20"
uuid = { version = "1.28.0", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
# R107：GUI 进程没有控制台，日志必须落到 app data 目录里的文件，否则 settings.rs 那两条
# `warn!`（R87）和 spec:543「全文搜索日志文件」都凭空消失。
# 只开 fmt + std：不引 `tracing-appender`（滚动/非阻塞全家桶，<15MB 安装包是验收线），
# 不引 `env-filter`（没有人需要按 target 过滤），不引 `ansi`（写文件不需要颜色）。
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# R138：`rand` 不是本 crate 的直接依赖，Cargo.lock 里的 0.9.5 / 0.10.3 **都是传递依赖**，
# 传递依赖不能 `use rand::`。Step 1 的噪声图夹具用 `rand::rng()`（0.9 API），必须显式加。
rand = "0.9"

[target."cfg(windows)".dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
