[package]
name = "qwen-do"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qwen_do_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 这里**没有**外部插件。曾经有 `tauri-plugin-dialog`：它只为兑现 capabilities 里的
# `dialog:allow-open`（spec:459 的图片附件入口），而 R144 把入口换成了原生
# `<input type="file">`（前端拿不到路径 ⇒ 不需要 dialog，也不需要任何 fs 权限）。
# 权限与插件注册一起摘掉，评审 #29 标准轴 3。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = { version = "0.42.2", features = ["chat-completion", "realtime"] }
futures = "0.3.34"
tokio = { version = "1.53.3", features = ["full"] }
base64 = "0.23.1"
# R139：默认 features 会拉进 default-formats = avif(ravif)/bmp/dds/exr/ff/gif/hdr/ico/jpeg/
# png/pnm/qoi/tga/tiff/webp + rayon。本任务只需要 **gif / jpeg / png / webp 解码** 与
# **jpeg / png 编码**。安装包 <15MB 是验收线（Cargo.toml 里 reqwest 那条注释同一条红线），
# 所以这里关掉默认 features，只点四个格式。
# 注：`rayon` 关掉后单张 4000px 缩放是否变慢**未实测**，不许预防性加回来。
image = { version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
async-stream = "0.3.6"
async-trait = "0.1.92"
thiserror = "2.0.21"
# default-features=false + default-tls 保持 rustls（async-openai 已带入）。
# 打开 native-tls 会多出一整套系统 TLS 依赖，安装包 <15MB 是验收线，别放宽这行。
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls"] }
# T22：SSRF 判定层（tools/fetch_guard.rs）需要 URL 解析与 IP 网段判定。两者此前
# 已是传递依赖（reqwest→url/ipnet），提为直接依赖才能 `use`，cargo tree 无新增包。
url = "2"
ipnet = "2"
tokio-util = "0.7.20"
uuid = { version = "1.28.0", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
# R107：GUI 进程没有控制台，日志必须落到 app data 目录里的文件，否则 settings.rs 那两条
# `warn!`（R87）和 spec:543「全文搜索日志文件」都凭空消失。
# 只开 fmt + std：不引 `tracing-appender`（滚动/非阻塞全家桶，<15MB 安装包是验收线），
# 不引 `env-filter`（没有人需要按 target 过滤），不引 `ansi`（写文件不需要颜色）。
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
] }
# T24b：换掉 `htmd`（R264 —— spec 5.5 的判定门实测不过，见
# `docs/findings/plan-b-fetch-quality.md`）。HTML 抽取改成两段：`readability` 定正文边界 +
# `html2md` DOM→Markdown。**关掉 readability 的 default features**：它默认拉一整套
# `reqwest 0.11`（含 native-tls 那一串），只为它的 `scrape()` 便利函数服务，而我们只喂
# 已经取回的字节；`default-features = false` 把这条重复 HTTP 栈摘掉（体积账：task-24b 报告 Step 5）。
readability = { version = "0.3.0", default-features = false }
html2md = "0.2.17"
# R265：charset 解码。brief 猜它「随 html5ever 传递带入」，实测**不是**
# （`readability 0.3.0`→html5ever 0.26、`html2md 0.2.17`→html5ever 0.39 两族都不带 encoding_rs），
# 所以这是一个真·新增包（自身零依赖，代价见报告，已按 brief 的要求在报告里提请裁定）。
encoding_rs = "0.8.42"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# T24b：`panic = "abort"` 摘掉了 —— `html2md` 的 `[lib] crate-type` 里带 `dylib`/`staticlib`
# （上游所有 0.2.x 版本都是，实测 0.2.6→0.2.17），而这两种 crate-type 必须链 `panic_unwind`，
# 在 abort profile 下**编译不过**（`error: the linked panic runtime panic_unwind is not compiled
# with this crate's panic strategy abort`）。代价是发布产物变大，前后实测数在
# `.superpowers/sdd/2026-10-21-plan-b-tools-mcp/task-24b-report.md` 的 Step 5；
# 要换回 abort 就得换一个不带 dylib 的 Markdown 转换器（决策归用户，不在本任务擅自换）。
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# R138：`rand` 不是本 crate 的直接依赖，Cargo.lock 里的 0.9.5 / 0.10.3 **都是传递依赖**，
# 传递依赖不能 `use rand::`。Step 1 的噪声图夹具用 `rand::rng()`（0.9 API），必须显式加。
rand = "0.9"
# T4 探针（`examples/mcp_probe.rs`，Plan A 切片 0 的风险验证）是 `rmcp` 在本 crate 里
# 唯一的用户，而 `src/` 零引用 —— MCP 客户端是 Plan B 的活。留在 `[dependencies]`
# 就等于把一整套 client + child-process 传输链编进发布产物，直接顶到 <15MB 那条验收线
# 上（评审 #29 规格轴：Plan B 依赖提前进产物）。`examples/` 用得到 `[dev-dependencies]`，
# 所以探针照旧可跑；Plan B 把它移回 `[dependencies]` 的那天，它才有生产用户。
rmcp = { version = "3.5.1", features = ["client", "transport-io", "transport-child-process"] }

[target."cfg(windows)".dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
