[package]
name = "lfttdo"
default-run = "lfttdo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "lfttdo-launcher"
path = "src/bin/launcher.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lfttdo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 这里**没有**外部插件。曾经有 `tauri-plugin-dialog`：它只为兑现 capabilities 里的
# `dialog:allow-open`（spec:459 的图片附件入口），而 R144 把入口换成了原生
# `<input type="file">`（前端拿不到路径 ⇒ 不需要 dialog，也不需要任何 fs 权限）。
# 权限与插件注册一起摘掉，评审 #29 标准轴 3。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = { version = "0.42.2", features = ["chat-completion", "realtime", "byot"] }
futures = "0.3.34"
tokio = { version = "1.53.3", features = ["full"] }
base64 = "0.23.1"
# R139：默认 features 会拉进 default-formats = avif(ravif)/bmp/dds/exr/ff/gif/hdr/ico/jpeg/
# png/pnm/qoi/tga/tiff/webp + rayon。本任务只需要 **gif / jpeg / png / webp 解码** 与
# **jpeg / png 编码**。安装包 <15MB 是验收线（Cargo.toml 里 reqwest 那条注释同一条红线），
# 所以这里关掉默认 features，只点四个格式。
# 注：`rayon` 关掉后单张 4000px 缩放是否变慢**未实测**，不许预防性加回来。
image = { version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
async-stream = "0.3.6"
async-trait = "0.1.92"
thiserror = "2.0.21"
# default-features=false + default-tls 保持 rustls（async-openai 已带入）。
# 打开 native-tls 会多出一整套系统 TLS 依赖，安装包 <15MB 是验收线，别放宽这行。
reqwest = { version = "0.13.5", default-features = false, features = ["json", "default-tls"] }
# T22：SSRF 判定层（tools/fetch_guard.rs）需要 URL 解析与 IP 网段判定。两者此前
# 已是传递依赖（reqwest→url/ipnet），提为直接依赖才能 `use`，cargo tree 无新增包。
url = "2"
ipnet = "2"
tokio-util = "0.7.20"
uuid = { version = "1.28.0", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
# R107：GUI 进程没有控制台，日志必须落到 app data 目录里的文件，否则 settings.rs 那两条
# `warn!`（R87）和 spec:543「全文搜索日志文件」都凭空消失。
# 只开 fmt + std：不引 `tracing-appender`（滚动/非阻塞全家桶，<15MB 安装包是验收线），
# 不引 `env-filter`（没有人需要按 target 过滤），不引 `ansi`（写文件不需要颜色）。
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
] }
# T24b：HTML 抽取两段式 —— `readability` 定正文边界（R264：T24 判门证明「没有正文边界」这个
# 概念的整页转换器不合格，见 `docs/findings/plan-b-fetch-quality.md`）+ 一个 DOM→Markdown
# 转换器把那段片段转给模型。**关掉 readability 的 default features**：它默认拉一整套
# `reqwest 0.11`（含 native-tls 那一串），只为它的 `scrape()` 便利函数服务，而我们只喂
# 已经取回的字节；`default-features = false` 把这条重复 HTTP 栈摘掉（体积账：task-24b 报告 Step 5）。
readability = { version = "0.3.0", default-features = false }
# T24b 修复轮 1（R267）：Markdown 那一步换回 `htmd`。不是推翻 R264，而是 R264 挂的**不是这一步**：
# T24 判门量的是「整页喂给 htmd」⇒ 没有正文边界这个概念，`<script>/<style>` 的文本和整条导航
# 全都进结果。现在它拿到的是 **readability 已经裁掉的正文片段**，脚本与样式在 `scorer::clean`
# 的样板清单里就已经不在片段里了 ⇒ 同一个转换器在裁剪后的输入上合格。
# 换回来的真正理由是**体积线**：`html2md` 的 `[lib] crate-type` 带 `dylib`/`staticlib`
# （0.2.6→0.2.17 全是），这两种 crate-type 必须链 `panic_unwind`，在 `panic = "abort"` 下
# **编译不过** ⇒ 首轮被迫把 profile 改成 `unwind`，代价 +5 436 416 字节（首轮报告 Step 5）。
# `htmd` 是默认 crate-type（rlib），`abort` 下能编（首轮之前的 release 产物就是它）。
htmd = "0.5.6"
# R265：charset 解码。brief 猜它「随 html5ever 传递带入」，实测**不是**
# （`readability 0.3.0`→html5ever 0.26、`htmd 0.5.6`→html5ever 0.38 两族都不带 encoding_rs），
# 所以这是一个真·新增包（自身零依赖，代价见报告，已按 brief 的要求在报告里提请裁定）。
# R268：本轮**保留原样**，不动。
encoding_rs = "0.8.42"
# T31 / R312：`rmcp` 从 `[dev-dependencies]` 挪进 `[dependencies]`。挪的理由不是顺手：
# 桥（`src/mcp/bridge.rs`）是**产品代码**（MCP 是功能），而 R138 把它放在 dev 位是 T4 探针
# 时代的临时安排，原注释写的「Plan B 把它移回 `[dependencies]` 的那天，它才有生产用户」
# 兑现的就是今天。
# **代价（这一行就是记账本身）**：rmcp 的 client + child-process 传输链从此进 app 二进制，
# T46/T47 那份安装包体积与冷启动读数**全部过期**（它们是在**没有** rmcp 的产物上测的），
# 复测归 T37 的门禁；本轮不重测安装包（构建一次几分钟且与本轮判断无关）。
# feature 照旧三条，**不加** `which-command`（R305：路径解析自己写、解析器可注入，
# 单测才不依赖本机装没装 node —— 与「单测不碰网络」同一条纪律）。
rmcp = { version = "3.5.1", features = ["client", "transport-io", "transport-child-process"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 本仓库既有设定（<15MB 安装包是验收线）。首轮为了 `html2md` 把它改成过 `unwind`，
# 那是 5.4 MB 增量的**唯一来源**；R267 换掉 html2md 之后这里恢复 `abort`。
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# R138：`rand` 不是本 crate 的直接依赖，Cargo.lock 里的 0.9.5 / 0.10.3 **都是传递依赖**，
# 传递依赖不能 `use rand::`。Step 1 的噪声图夹具用 `rand::rng()`（0.9 API），必须显式加。
rand = "0.9"
# `rmcp` 不在这儿了：T31 / R312 把它挪进 `[dependencies]`（代价与理由记在那一条的注释里）。

[target."cfg(windows)".dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
# T34 / R322：JobObject 的进程树回收。`windows` 0.62.2 本来就在 Cargo.lock 里（Tauri 的传递依赖），
# 这里只是把它提成直接依赖并**只开三个 feature**（Foundation / Threading / JobObjects）；
# 不新增任何 crate，代价是编译这两个模块。手写 `extern "system"` 也能做，但
# `JOBOBJECT_EXTENDED_LIMIT_INFORMATION` 的嵌套布局写错时是**静默失败**（SetInformationJobObject
# 收一个 void* + 长度），核对成本高于直接用它。
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }
